name: Build draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install build setuptools wheel
      - run: python -m unittest discover -s tests -v
      - name: Validate tag and version
        run: |
          python - <<'PY'
          import os, tomllib
          from delta_wifi import __version__
          version = tomllib.load(open('pyproject.toml','rb'))['project']['version']
          assert __version__ == version
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Run this workflow on a vX.Y.Z tag matching the package version'
          PY
      - name: Build precompiled universal helpers and wheel
        run: python scripts/package_release.py --output dist
      - name: Verify a clean installation
        run: python scripts/smoke_release.py dist/delta-wifi-*-macos-universal.tar.gz
      - name: Generate the Homebrew formula from the actual archive
        run: python scripts/render_formula.py --repo "$GITHUB_REPOSITORY" --archive dist/delta-wifi-*-macos-universal.tar.gz --output dist/delta-wifi.rb
      - run: ruby -c dist/delta-wifi.rb
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-files
          path: dist/*
          retention-days: 14
      - name: Create a reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --generate-notes --title "delta-wifi $GITHUB_REF_NAME"
